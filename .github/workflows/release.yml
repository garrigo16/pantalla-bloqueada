name: Publicar versión
on:
  workflow_dispatch:
    inputs:
      version:
        description: Etiqueta de versión, por ejemplo v1.1.0
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/Shared/VersionInfo.cs']
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validar versión
        shell: pwsh
        run: |
          $source = Get-Content ./src/Shared/VersionInfo.cs -Raw
          $version = [regex]::Match($source, 'Current = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $env:RELEASE_TAG) { $env:RELEASE_TAG = 'v' + $version }
          if ($env:RELEASE_TAG -ne ('v' + $version)) { throw 'La etiqueta no coincide con la versión del código.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('RELEASE_TAG=' + $env:RELEASE_TAG)
      - name: Compilar
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Comprobar
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publicar instaladores verificados
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json isDraft 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Esa versión ya existe. Usa una versión nueva para publicar cambios.' }
          gh release create $env:RELEASE_TAG ./artifacts/Iniciar.exe ./artifacts/DrifftAnalyzer-Setup.exe ./artifacts/Desinstalar.exe ./artifacts/DrifftAnalyzer.zip ./artifacts/SHA256SUMS.txt ./artifacts/update.json --draft --target $env:GITHUB_SHA --title "Drifft Analyzer $env:RELEASE_TAG" --notes-file ./docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar la versión.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'La versión sigue como borrador; revisa los instaladores antes de publicarla.' }
